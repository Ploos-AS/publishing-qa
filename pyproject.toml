[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ploos-publishing-qa"
version = "0.1.0"
description = "Deterministic QA framework for Ploos AS publishing projects"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.20,<5"
]

[project.scripts]
publishing-qa = "publishing_qa.cli:main"
ploos-qa = "publishing_qa.command:entrypoint"
ploos-qa-release = "publishing_qa.release_cli:main"
ploos-qa-qualify = "publishing_qa.qualification_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
publishing_qa = ["schemas/*.json"]
