name: Validate publishing-qa

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate JSON schema syntax
        run: python -m json.tool schema/finding.schema.json >/dev/null

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s publishing-qa.yml
          test -s schema/finding.schema.json
          test -s docs/reviewer-roles.md
          test -s docs/release-gates.md

      - name: Install
        run: python -m pip install -e .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Dogfood deterministic QA
        run: publishing-qa .

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publishing-qa-report
          path: qa-report.json
          if-no-files-found: error
