name: Live provider qualification

on:
  workflow_dispatch:
    inputs:
      providers:
        description: "Providers: all or comma-separated openai,anthropic,google,mistral"
        required: true
        default: "all"
        type: string
      openai_model:
        description: "OpenAI model"
        required: false
        type: string
      anthropic_model:
        description: "Anthropic model"
        required: false
        type: string
      gemini_model:
        description: "Gemini model"
        required: false
        type: string
      mistral_model:
        description: "Mistral model"
        required: false
        type: string

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    environment: live-provider-qualification
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENAI_MODEL: ${{ inputs.openai_model }}
      ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
      GEMINI_MODEL: ${{ inputs.gemini_model }}
      MISTRAL_MODEL: ${{ inputs.mistral_model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - name: Qualify providers
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ inputs.providers }}" != "all" ]]; then
            IFS=',' read -ra requested <<< "${{ inputs.providers }}"
            for provider in "${requested[@]}"; do
              provider="${provider//[[:space:]]/}"
              args+=(--provider "$provider")
            done
          fi
          set +e
          ploos-qa-qualify "${args[@]}" --output provider-qualification.json
          status=$?
          set -e
          echo "qualification_exit=$status" >> "$GITHUB_ENV"
      - name: Upload qualification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-qualification
          path: provider-qualification.json
          if-no-files-found: error
      - name: Enforce qualification result
        if: always()
        shell: bash
        run: exit "${qualification_exit:-1}"
