qa_version: 1

project:
  type: course-book
  primary_language: nb
  languages: [nb, en]

source:
  paths: [docs]
  frontmatter_required: []

parity:
  enabled: false
  structure: true
  language_dirs:
    nb: docs/nb
    en: docs/en

exercises:
  enabled: false
  exercise_dir: exercises
  solution_dir: solutions

publication:
  enabled: false
  metadata_file: publication.yml
  required_metadata:
    - title
    - author
    - publisher
    - license
  required_artifacts: []
  # Example after a release build:
  # - dist/book.html
  # - dist/book.epub
  # - dist/book.pdf

chapter_order:
  enabled: false
  manifest: chapters.yml

hooks: []
# Example:
# - name: build-publications
#   command: make html epub pdf

review:
  technical: required
  pedagogical: required
  editorial: required
  exercises: required
  translation_parity: required
  accessibility: required
  references: required

ai:
  independent_reviews: true
  reviewers:
    required:
      - id: openai
        roles: [technical, qa_lead]
      - id: anthropic
        roles: [pedagogy, manuscript]
      - id: google
        roles: [fact_check, consistency]
      - id: mistral
        roles: [independent, language]
    supplemental: []
  # Supplemental reviewers are optional and never required for a normal release.
  # Example:
  # supplemental:
  #   - id: local-llm
  #     roles: [privacy, independent]
  #   - id: specialist
  #     roles: [domain_expert]

release:
  max_blocker: 0
  max_critical: 0
  max_high: 0
  require_deterministic_tests: true
  require_build: true
  require_human_approval: true
